[project]
name = "atlas-backend"
version = "0.1.0"
description = "FastAPI backend for the Wayfinder Atlas dashboard. Wraps the existing tools/ Python pipeline."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "sse-starlette>=2.1",
  "itsdangerous>=2.2",
  "slowapi>=0.1.9",
  "redis>=5.0",
  "PyYAML>=6.0",
  "Pillow>=10.0",
  "pillow-heif>=0.18",
  "python-multipart>=0.0.9",
  # Used by the tools/ scripts that the backend imports via
  # ensure_tools_on_path() — see tools/fetch_*_for_facility.py. Same package
  # the standalone CLI relies on, kept here so the container image has it.
  "requests>=2.31",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.7",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "piexif>=1.1.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
